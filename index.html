 grid.replaceChildren();const search=q.value.trim().toLocaleLowerCase('bs');

 for(const b of nav.children){b.classList.toggle('active',b.dataset.cat===selected);b.setAttribute('aria-pressed',String(b.dataset.cat===selected));}
