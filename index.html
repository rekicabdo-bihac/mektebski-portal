 if(/^udzbenik[-_.]?ilmihal[-_.]?[123](?:$|[-_.])/.test(n)||/^ejjuhel[-_.]?(?:veled|weled)/.test(n))return {cat:'udzbenici',number:null};
 // Nazivi koji izričito sadrže udzbenik, memori ili kviz idu u svoju oblast.
 const explicit=n.match(/(?:^|[-_.])(udzbenik|udzbenici|memori|kviz|kvizovi)(?=$|[-_.])/);
 if(explicit){
  const cat=({udzbenik:'udzbenici',udzbenici:'udzbenici',memori:'memori',kviz:'kvizovi',kvizovi:'kvizovi'})[explicit[1]];
  const match=n.match(/(?:^|[-_.])lekcij[ae][-_.]?(\d{1,3})(?=$|[-_.])/)||n.match(/(?:^|[-_.])(?:udzbenik|udzbenici|memori|kviz|kvizovi)[-_.]+(\d{1,3})(?=$|[-_.])/);
  return {cat,number:match?Number(match[1]):null};
 }

 if(level){
  const before=n.match(/(?:^|[-_.])lekcij[ae][-_.]?(\d{1,3})(?=$|[-_.])/);
  const after=n.match(/ilmihal[-_.]?[123][-_.]+(?:lekcij[ae][-_.]?)?(\d{1,3})(?=$|[-_.])/);
  const number=before?Number(before[1]):after?Number(after[1]):null;

 }
 // Ostale oblasti: kviz-15-..., memori-lekcija15-..., udzbenik-15-...
 const section=n.match(/(?:^|[-_.])(kvizovi|kviz|memori|udzbenici|udzbenik|igrice|igrica|igra|takmicenja|takmicenje|pjesmice|pjesmica|dove|dova)(?=$|[-_.])/);
 if(!section)return null;
 const mapping={kviz:'kvizovi',kvizovi:'kvizovi',memori:'memori',udzbenik:'udzbenici',udzbenici:'udzbenici',igrica:'igrice',igra:'igrice',igrice:'igrice',takmicenje:'takmicenja',takmicenja:'takmicenja',pjesmica:'pjesmice',pjesmice:'pjesmice',dova:'dove',dove:'dove'};

function prefixCategory(name){

function correctDisplayTitle(value){
 let t=String(value||'').trim();
 t=t.replace(/\b(allah[a-zčćžšđ]*|bog|bož[ij][a-zčćžšđ]*)\b/giu,word=>{
   const low=word.toLocaleLowerCase('bs');
   if(low==='bog')return 'Bog';
   if(low.startsWith('allah'))return 'Allah'+low.slice(5);
   return low.charAt(0).toLocaleUpperCase('bs')+low.slice(1);
 });
 t=t.replace(/^([\p{L}])/u,c=>c.toLocaleUpperCase('bs'));
 return t;
}

function mergeRepos(repos){
 const known=new Set(entries.map(e=>e.repo.toLowerCase()));let added=0;
 for(const r of repos){
  if(!r||!r.name||r.fork||r.archived||r.disabled||r.name.toLowerCase()==='mektebski-portal'||known.has(r.name.toLowerCase()))continue;

  const info=lessonInfo(r.name);
  entries.push({cat,label,...(info?.number?{number:info.number}:{}),repo:r.name,url:'https://'+GH_USER+'.github.io/'+encodeURIComponent(r.name)+'/',kind:'auto'});
  known.add(r.name.toLowerCase());added++;

async function syncGithub(){
 let cached=null;
 try{cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null')}catch(e){}
 if(cached&&Array.isArray(cached.repos)){
  mergeRepos(cached.repos);draw();
  if(Date.now()-cached.time<CACHE_MS)return;
 }
 try{
  let all=[];
  // GitHub javni API, 100 repozitorija po stranici; bez pristupnog tokena.
  for(let page=1;page<=20;page++){
   const response=await fetch('https://api.github.com/users/'+GH_USER+'/repos?per_page=100&page='+page+'&sort=created&direction=asc',{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
   if(!response.ok)throw Error('GitHub API: '+response.status);
   const batch=await response.json();if(!Array.isArray(batch))throw Error('Neispravan odgovor');
   all.push(...batch);if(batch.length<100)break;
  }
  const added=mergeRepos(all);
  lastSync=new Date().toLocaleString('bs-BA');
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({time:Date.now(),repos:all}))}catch(e){}
  draw();
  if(added)status.textContent+=' · Novo sa GitHuba: '+added;
 }catch(e){
  // Portal ostaje upotrebljiv i kad nema interneta ili API ograniči zahtjeve.
  console.warn('GitHub sinhronizacija nije dostupna:',e);
  if(!cached)status.textContent+=' · Automatska provjera trenutno nije dostupna';
 }
}

function makeItemCard(e){const isIlmihal=/^ilmihal[123]$/.test(e.cat);const a=document.createElement('a');a.className='tile'+(isIlmihal?' ilmihal-tile':e.kind==='auto'?' tile-auto':'');a.href=e.url;a.target='_self';a.setAttribute('aria-label',(e.number?'Lekcija '+e.number+', ':'')+e.label);a.title=e.label;if(isIlmihal){const n=e.number??lessonInfo(e.repo)?.number;if(n){const num=document.createElement('span');num.className='num';num.textContent='Lekcija '+n;a.append(num)}a.append(makeEmoji(e));const t=document.createElement('span');t.className='name';t.textContent=e.label;a.append(t)}else{if(e.number&&e.kind==='auto'){const num=document.createElement('span');num.className='num';num.textContent='Lekcija '+e.number;a.append(num)}if(e.image){const im=document.createElement('img');im.src=e.image.startsWith('data:')?e.image:'https://raw.githubusercontent.com/rekicabdo-bihac/mektebski-portal/main/'+e.image;im.alt=e.label;im.loading='lazy';im.onerror=()=>im.replaceWith(makeEmoji(e));a.append(im)}else{a.append(makeEmoji(e));const t=document.createElement('span');t.className='name';t.textContent=e.label;a.append(t)}}grid.append(a)}
function draw(){const search=q.value.trim().toLocaleLowerCase('bs');grid.replaceChildren();nav.replaceChildren();const searching=Boolean(search);window.selectedCategoryForAnalytics=searching?'pretraga':selected;
 if(searching){nav.classList.add('hidden');const items=entries.filter(e=>e.label.toLocaleLowerCase('bs').includes(search)||e.repo.toLocaleLowerCase('bs').includes(search));items.sort((a,b)=>a.label.localeCompare(b.label,'bs'));items.forEach(makeItemCard);status.textContent='Pronađeno '+items.length+' sadržaja'+(lastSync?' · GitHub provjeren: '+lastSync:'');return}else nav.classList.remove('hidden');
